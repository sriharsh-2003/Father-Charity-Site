<!--
  Generic religious-architecture silhouette (mosque domes, minarets,
  crescents). Illustrated vector shapes only, not a real building and not a
  stock photo, same reasoning as arch-silhouette.svg in this folder: license
  on a search-result photo can't be verified, and a family's memorial site
  shouldn't carry that risk. Trivially swappable for a real photo the family
  owns the rights to later; see README-handoff.md.

  Toggle visibility site-wide via `showReligiousBackdrop` in
  assets/data/site-config.js, since a client may not always want it.
-->
<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice">
  <g fill="#0d3b2e">
    <!-- ground line -->
    <rect x="0" y="360" width="900" height="140"/>

    <!-- left minaret -->
    <rect x="60" y="200" width="26" height="160"/>
    <rect x="50" y="185" width="46" height="18" rx="2"/>
    <path d="M 73 185 L 60 150 L 86 150 Z"/>
    <circle cx="73" cy="140" r="6"/>
    <path d="M 66 132 q 7 -14 14 0 q -7 6 -14 0 Z"/>

    <!-- side low dome building -->
    <rect x="120" y="300" width="120" height="60"/>
    <path d="M 120 300 Q 180 240 240 300 Z"/>
    <circle cx="180" cy="232" r="7"/>

    <!-- central main dome + structure -->
    <rect x="300" y="260" width="180" height="100"/>
    <path d="M 300 260 Q 390 130 480 260 Z"/>
    <rect x="382" y="112" width="16" height="34"/>
    <circle cx="390" cy="104" r="9"/>
    <path d="M 380 96 q 10 -18 20 0 q -10 8 -20 0 Z"/>

    <!-- entrance arch -->
    <path d="M 360 360 L 360 320 Q 390 292 420 320 L 420 360 Z" fill="#faf8f3" opacity="0.18"/>

    <!-- right minaret (taller, mirrors left) -->
    <rect x="520" y="180" width="28" height="180"/>
    <rect x="508" y="163" width="52" height="20" rx="2"/>
    <path d="M 534 163 L 519 122 L 549 122 Z"/>
    <circle cx="534" cy="110" r="7"/>
    <path d="M 526 101 q 8 -16 16 0 q -8 7 -16 0 Z"/>

    <!-- secondary side dome building -->
    <rect x="590" y="290" width="140" height="70"/>
    <path d="M 590 290 Q 660 220 730 290 Z"/>
    <circle cx="660" cy="212" r="8"/>

    <!-- far right smaller minaret -->
    <rect x="780" y="230" width="22" height="130"/>
    <rect x="771" y="217" width="40" height="16" rx="2"/>
    <path d="M 791 217 L 779 184 L 803 184 Z"/>
    <circle cx="791" cy="176" r="5"/>

    <!-- lattice window dots along the central facade, echoes mashrabiya work -->
    <g opacity="0.25">
      <circle cx="330" cy="330" r="4"/>
      <circle cx="350" cy="330" r="4"/>
      <circle cx="430" cy="330" r="4"/>
      <circle cx="450" cy="330" r="4"/>
    </g>
  </g>
</svg>
