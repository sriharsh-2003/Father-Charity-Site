<!--
  Third backdrop composition: a repeating geometric lattice screen
  (mashrabiya-style), rather than a skyline or a single arch. Deliberately
  the most abstract of the three, no dome/minaret silhouettes at all, so
  a page using this reads as visually distinct from pages using either of
  the other two. Same illustrated-vector, not-a-photo reasoning as
  religious-silhouette.svg, see that file's own comment for why.
-->
<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice">
  <g fill="#0d3b2e">
    <!-- repeating eight-point star lattice, arranged in a loose grid with
         irregular spacing so it doesn't read as a perfectly tiled pattern -->
    <g opacity="0.55">
      <path transform="translate(60 260) scale(1.3)" d="M20 0 L25 15 L40 15 L28 24 L33 40 L20 30 L7 40 L12 24 L0 15 L15 15 Z"/>
      <path transform="translate(170 180) scale(0.9)" d="M20 0 L25 15 L40 15 L28 24 L33 40 L20 30 L7 40 L12 24 L0 15 L15 15 Z"/>
      <path transform="translate(150 340) scale(1.1)" d="M20 0 L25 15 L40 15 L28 24 L33 40 L20 30 L7 40 L12 24 L0 15 L15 15 Z"/>
      <path transform="translate(280 250) scale(0.7)" d="M20 0 L25 15 L40 15 L28 24 L33 40 L20 30 L7 40 L12 24 L0 15 L15 15 Z"/>
      <path transform="translate(330 380) scale(1.0)" d="M20 0 L25 15 L40 15 L28 24 L33 40 L20 30 L7 40 L12 24 L0 15 L15 15 Z"/>
      <path transform="translate(40 400) scale(0.6)" d="M20 0 L25 15 L40 15 L28 24 L33 40 L20 30 L7 40 L12 24 L0 15 L15 15 Z"/>
      <path transform="translate(230 420) scale(0.8)" d="M20 0 L25 15 L40 15 L28 24 L33 40 L20 30 L7 40 L12 24 L0 15 L15 15 Z"/>
    </g>
    <!-- a thin pointed-arch window frame, off to one side, ties the
         pattern back to the site's architectural motif without repeating
         the skyline or single-arch compositions -->
    <path d="M 380 460 L 380 300 Q 380 240 420 240 Q 460 240 460 300 L 460 460 Z" opacity="0.35"/>
    <path d="M 396 460 L 396 302 Q 396 258 420 258 Q 444 258 444 302 L 444 460 Z" fill="#faf8f3" opacity="0.2"/>
    <!-- ground line -->
    <rect x="0" y="460" width="900" height="40" opacity="0.55"/>
  </g>
</svg>
